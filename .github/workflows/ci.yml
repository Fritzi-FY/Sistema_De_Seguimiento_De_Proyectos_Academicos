name: CI Baseline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-specs:
    name: Validate OpenSpec Specifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.7.0

      - name: Validate OpenSpec Specs (Strict Mode)
        run: openspec validate --specs --strict

  quality-gates:
    name: Code Quality and Build Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Verify code formatting
        run: npm run format:check

      - name: Run Linter
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Automated Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build

  sql-integration:
    name: PostgreSQL ephemeral integration (25 SQL cases)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: is488_ci_admin
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
          PGDATA: /var/lib/postgresql/18/ci
        ports:
          - 55489:5432
          - 55490:5432
        options: >-
          --health-cmd "pg_isready -U is488_ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IS488_CI_SQL: '1'
      IS488_CI_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      IS488_CI_ADMIN_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
      IS488_CI_EVIDENCE: /tmp/is488-sql-ci-${{ github.run_id }}-${{ github.run_attempt }}
      IS488_MIGRATION_TEST_EVIDENCE: /tmp/is488-sql-ci-${{ github.run_id }}-${{ github.run_attempt }}
      IS488_SCOPE_EVIDENCE: /tmp/is488-sql-ci-${{ github.run_id }}-${{ github.run_attempt }}
      IS488_SQL_TEST: '1'
      IS488_KANBAN_SQL_TEST: '1'
      IS488_TEACHER_SQL_TEST: '1'
      IS488_MIGRATOR_TEST: '1'
      NODE_OPTIONS: --experimental-transform-types
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (clean install)
        run: npm ci
      - name: Generate credentials exclusive to this CI service
        run: |
          node --input-type=module -e "import { randomBytes } from 'node:crypto'; import { appendFileSync } from 'node:fs'; const password = randomBytes(32).toString('hex'); console.log('::add-mask::' + password); appendFileSync(process.env.GITHUB_ENV, 'IS488_CI_ROLE_PASSWORD=' + password + '\n');"
      - name: Verify fresh service and prepare migrated synthetic fixtures
        run: node apps/api/testing/prepare-sql-ci.ts
      - name: Run all SQL cases and reject omissions
        run: node scripts/run-sql-ci.mjs
